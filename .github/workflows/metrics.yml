name: Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Contribution calendar
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.METRICS_TOKEN }}
          user: BrianBett125
          template: classic
          base: ""
          filename: metrics.isocalendar.svg
          config_timezone: Africa/Nairobi
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Languages: all-time and recently used
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.METRICS_TOKEN }}
          user: BrianBett125
          template: classic
          base: ""
          filename: metrics.languages.svg
          config_timezone: Africa/Nairobi
          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_colors: github
          plugin_languages_recent_days: 180
          plugin_languages_recent_load: 400
          plugin_languages_recent_categories: programming

      # Overview: commits, PRs, issues, repos, followers
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.METRICS_TOKEN }}
          user: BrianBett125
          template: classic
          base: header, activity, community, repositories
          filename: metrics.overview.svg
          config_timezone: Africa/Nairobi
